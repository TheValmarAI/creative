[project]
name = "creative"
version = "0.1.0"
description = "Framework-led creative generation with independently random selections"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "starlette>=1.10,<2",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-ai-slim[openai,anthropic,google]>=2.61,<3",
  "pydantic-settings>=2.8,<3",
  "mcp>=1.30,<2",
  "logfire>=5.3,<6",
]

[project.scripts]
creative = "creative.interfaces.cli:main"
creative-api = "creative.interfaces.api:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creative"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: opt-in paid provider smoke test"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
